name: 🛰 Keepalive

# GitHub بعد از ۶۰ روز بی‌کاری، cron را غیرفعال می‌کند؛ این کامیت هفتگی جلوگیری می‌کند.

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "keepalive"
          git config user.email "keepalive@users.noreply.github.com"
          git commit --allow-empty -m "keepalive: MONARCH stays awake"
          git push
